<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me - King John D. De Lara</title>
    <style>
        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            color: #1e3a8a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background-color: #ffffff;
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 119, 182, 0.15);
            text-align: center;
            border: 2px solid #93c5fd;
            max-width: 480px;
            width: 100%;
        }

        .contact-box {
            background-color: #f0f9ff;
            padding: 20px;
            border-radius: 15px;
            border-left: 5px solid #2563eb;
            text-align: left;
            margin: 20px 0 25px 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .contact-item {
            display: flex;
            align-items: center;
            margin: 12px 0;
            font-size: 14px;
            color: #1e3a8a;
            word-break: break-word;
        }

        .contact-item strong {
            color: #1d4ed8;
            min-width: 130px;
            display: inline-block;
        }

        .contact-icon {
            font-size: 18px;
            margin-right: 10px;
        }

        .form-container {
            background-color: #f0f9ff;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #bfdbfe;
            text-align: left;
            margin-bottom: 25px;
        }

        .form-container h3 {
            color: #1d4ed8;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 16px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #1d4ed8;
            margin-bottom: 4px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #93c5fd;
            border-radius: 8px;
            font-family: inherit;
            font-size: 13px;
            box-sizing: border-box;
            outline: none;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 5px rgba(37, 99, 235, 0.3);
        }

        .submit-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s ease;
        }

        .submit-btn:hover {
            background-color: #1d4ed8;
        }

        nav button {
            background-color: #60a5fa;
            color: white;
            border: none;
            padding: 11px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 25px;
            margin: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.1);
        }

        nav button.active, nav button:hover {
            background-color: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(37, 99, 235, 0.3);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 style="color: #1d4ed8; margin: 0; font-size: 28px;">GET IN TOUCH</h1>
        <p style="color: #475569; font-size: 15px; margin-top: 5px;">Contact Information</p>

        <!-- Contact Information Container -->
        <div class="contact-box">
            <div class="contact-item">
                <span class="contact-icon">📞</span>
                <strong>CONTACT #:</strong> 09123456789
            </div>
            <div class="contact-item">
                <span class="contact-icon">✉️</span>
                <strong>EMAIL #:</strong> kingjonh.delara@deped.gov.ph
            </div>
            <div class="contact-item">
                <span class="contact-icon">🏠</span>
                <strong>ADDRESS:</strong> Barangay 23-C (POB.), Davao City
            </div>
            <div class="contact-item">
                <span class="contact-icon">📘</span>
                <strong>FACEBOOK:</strong> <a href="https://www.facebook.com/" target="_blank" style="color: #2563eb; text-decoration: none; font-weight: 600;">Kj Dorlones</a>
            </div>
        </div>

        <!-- Interactive Question Form -->
        <div class="form-container">
            <h3>💬 Need to ask to know me?</h3>
            <form>
                <div class="form-group">
                    <label for="name">Your Name:</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label for="email">Your Email:</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="question">Your Question or Message:</label>
                    <textarea id="question" name="question" rows="3" placeholder="Ask me anything..." required></textarea>
                </div>
                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </div>

        <!-- Navigation Buttons -->
        <nav>
            <a href="index.html"><button>HOME</button></a>
            <a href="about.html"><button>ABOUT ME</button></a>
            <a href="contact.html"><button class="active">CONTACT ME</button></a>
        </nav>
    </div>

</body>
</html>
