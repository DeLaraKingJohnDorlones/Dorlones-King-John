<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - King John D. De Lara</title>
    <style>
        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            color: #1e3a8a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background-color: #ffffff;
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 119, 182, 0.15);
            text-align: center;
            border: 2px solid #93c5fd;
            max-width: 480px;
            width: 100%;
            transition: transform 0.3s ease;
        }

        .profile-img {
            width: 160px;
            height: 160px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #2563eb;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            transition: transform 0.3s ease, border-color 0.3s ease;
            margin: 15px 0;
        }

        .profile-img:hover {
            transform: scale(1.05);
            border-color: #1d4ed8;
        }

        .badge-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 15px 0 25px 0;
        }

        .badge {
            background-color: #f0f9ff;
            color: #1d4ed8;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid #bfdbfe;
        }

        .motto {
            font-style: italic;
            color: #2563eb;
            margin-bottom: 20px;
            font-size: 14px;
        }

        nav button {
            background-color: #60a5fa;
            color: white;
            border: none;
            padding: 11px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 25px;
            margin: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.1);
        }

        nav button.active, nav button:hover {
            background-color: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(37, 99, 235, 0.3);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 style="color: #1d4ed8; margin: 0; font-size: 28px;">WELCOME TO MY WEBSITE</h1>
        <p style="color: #475569; font-size: 15px; margin-top: 5px;">King Jonh D. De Lara (KJ)</p>

        <!-- Profile Photo -->
        <img src="profile.jpg" alt="Profile Photo" class="profile-img">

        <p class="motto">"Everything happens for a reason."</p>

        <!-- Quick Stats Badges -->
        <div class="badge-container">
            <span class="badge">🎓 Aspiring Teacher</span>
            <span class="badge">📍 Davao City</span>
            <span class="badge">🏐 Volleyball</span>
        </div>

        <!-- Navigation Buttons -->
        <nav>
            <a href="index.html"><button class="active">HOME</button></a>
            <a href="about.html"><button>ABOUT ME</button></a>
            <a href="contact.html"><button>CONTACT ME</button></a>
        </nav>
    </div>

</body>
</html>
